<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>事项进度查询 · 印章业务信息管理系统</title>
<script src="./faq-config.js"></script>
<script src="./inbox-config.js"></script>
<style>
  :root {
    --bg: #050505;
    --fg: #f5f4f0;
    --muted: rgba(245,244,240,.55);
    --faint: rgba(245,244,240,.30);
    --line: rgba(255,255,255,.10);
    --line-strong: rgba(255,255,255,.18);
    --gold: #e8b558;
    --gold-hi: #f5cd7e;
    --gold-deep: #c9871e;
    --card: rgba(255,255,255,.04);
    --ok: #4ade80;
    --warn: #f5cd7e;
    --err: #f87171;
    --app-font: 'AlimamaFangYuanTiVF', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--app-font);
    color: var(--fg);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(120% 70% at 50% -8%, rgba(232,181,88,.12), rgba(232,181,88,0) 55%),
      #050505;
    min-height: 100vh;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 28px 16px 56px; }

  /* 顶部 hero：与 submit 反馈页一致的徽章 / 标题 / 副标题风格 */
  .hero { text-align: center; padding: 26px 0 12px; }
  .hero .badge { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line-strong); }
  .hero .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.9); animation: pulse 2.4s ease-in-out infinite; flex: none; }
  .shiny { color: rgba(245,244,240,.55); background: linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 60%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; animation: shine 4.5s linear infinite; }
  @keyframes shine { 0% { background-position: 100%; } 100% { background-position: -100%; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .hero h1 { font-size: clamp(30px, 6.4vw, 44px); margin: 0 0 10px; letter-spacing: -.02em; font-weight: 700; }
  .hero p { font-size: 14px; color: var(--muted); margin: 0 auto; max-width: 420px; }
  .backbar { text-align: center; margin: 16px 0 4px; }

  .back { display: inline-flex; align-items: center; justify-content: center; margin-top: 4px; padding: 7px 16px; border-radius: 9999px; font-size: 12.5px; font-weight: 600; text-decoration: none; color: var(--muted); background: rgba(255,255,255,.03); border: 1px solid var(--line); }
  .back:hover { color: var(--gold); border-color: rgba(232,181,88,.40); background: rgba(232,181,88,.08); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 24px 20px; margin-top: 18px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 70px rgba(0,0,0,.5); }

  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
  input[type=text] { width: 100%; padding: 14px 15px; font-size: 18px; letter-spacing: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.03); color: var(--fg); outline: none; transition: border-color .15s, box-shadow .15s, background .15s; text-transform: uppercase; }
  input[type=text]:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,181,88,.18); background: rgba(255,255,255,.05); }

  button.query { width: 100%; margin-top: 16px; padding: 15px; font-size: 16px; font-weight: 700; font-family: inherit; color: #1a1206; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border: none; border-radius: 999px; cursor: pointer; transition: transform .12s, box-shadow .15s, background .15s; box-shadow: 0 8px 30px rgba(232,181,88,.22), inset 0 1px 0 rgba(255,255,255,.45); }
  button.query:hover { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); }
  button.query:active { transform: translateY(1px); }
  button.query:disabled { opacity: .5; cursor: default; }

  .msg { margin-top: 14px; padding: 13px 15px; border-radius: 14px; font-size: 14px; }
  .msg.err { background: rgba(248,113,113,.10); color: var(--err); border: 1px solid rgba(248,113,113,.30); }
  .msg.warn { background: rgba(245,205,126,.10); color: var(--gold-hi); border: 1px solid rgba(245,205,126,.30); }

  .spinner { width: 22px; height: 22px; margin: 18px auto; border: 3px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .result { margin-top: 18px; }
  .result h2 { font-size: 17px; margin: 0 0 12px; font-weight: 700; }

  .code-badge { display: inline-block; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 24px; font-weight: 700; letter-spacing: 4px; color: var(--gold); padding: 8px 16px; border: 1px solid rgba(232,181,88,.35); border-radius: 14px; margin-bottom: 14px; background: rgba(232,181,88,.08); }

  .row { display: flex; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .row .k { width: 96px; flex-shrink: 0; color: var(--muted); }
  .row .v { flex: 1; word-break: break-word; white-space: pre-wrap; }
  .v.ok { color: var(--ok); font-weight: 600; }
  .v.warnc { color: var(--gold-hi); font-weight: 600; }
  .v.bad { color: var(--err); font-weight: 600; }

  .section-title { margin: 20px 0 8px; font-size: 14px; font-weight: 600; color: var(--fg); }

  /* 跟踪进度时间线 */
  .timeline { margin-top: 8px; padding-left: 4px; }
  .tl-item { position: relative; padding: 0 0 16px 24px; border-left: 2px solid var(--line); }
  .tl-item:last-child { border-left-color: transparent; padding-bottom: 0; }
  .tl-item::before { content: ''; position: absolute; left: -7px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--gold); border: 2px solid #050505; box-shadow: 0 0 0 3px rgba(232,181,88,.15); }
  .tl-time { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .tl-content { font-size: 14px; word-break: break-word; white-space: pre-wrap; }

  .empty-note { margin-top: 10px; font-size: 13.5px; color: var(--muted); background: rgba(255,255,255,.04); padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); }

  .foot { margin-top: 24px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.7; }
  .foot a { color: var(--gold); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }

  .banner { margin-top: 16px; padding: 13px 15px; border-radius: 14px; font-size: 13px; background: rgba(245,205,126,.10); color: var(--gold-hi); border: 1px solid rgba(245,205,126,.30); }

  /* 附件展示：图片缩略图 + 其他文件链接 */
  .section-title + .att-grid { margin-top: 2px; }
  .att-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  .att-thumb { display: block; width: 84px; height: 84px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); background: rgba(255,255,255,.03); }
  .att-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .att-file { display: inline-flex; align-items: center; max-width: 100%; padding: 7px 11px; border-radius: 12px; font-size: 13px; text-decoration: none; color: var(--gold-hi); background: rgba(232,181,88,.10); border: 1px solid rgba(232,181,88,.28); word-break: break-all; }
  .att-empty { margin-top: 8px; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <span class="badge"><span class="dot"></span><span class="shiny">印章业务 · 进度查询</span></span>
      <h1>事项进度查询</h1>
      <p>输入提交问题时获得的事项编码，即可查询当前处理进度。</p>
    </div>

    <div class="backbar">
      <a class="back" href="./submit.html">← 返回问题反馈</a>
    </div>

    <div class="card">
      <label for="codeInput">事项编码</label>
      <input type="text" id="codeInput" placeholder="例如 A7K2P9" autocomplete="off" maxlength="12" />

      <button class="query" id="queryBtn" onclick="doQuery()">查询进度</button>

      <div id="banner" class="banner" style="display:none"></div>
      <div id="loading" class="spinner" style="display:none"></div>
      <div id="msg"></div>
      <div id="result" class="result"></div>
    </div>

    <div class="foot">
      本查询仅展示该事项的处理情况与跟踪进度，不涉及您的联系方式等隐私信息。<br/>
      若忘记事项编码，请联系提交时对应的经办人员核实。
    </div>
  </div>

<script>
  const FAQ_WORKER = (window.FAQ_WORKER_BASE || '').replace(/\/+$/, '')

  // ===== 国内直连数据源（优先）：Gitee contents API（避免 workers.dev 在大陆被拦截）=====
  // 数据镜像仓：aiesse/inbox（inbox.json 在仓库根目录）、aiesse/work（data/logs.json、data/tracks.json）。
  // 令牌复用 inbox-config.js 下发的 GITEE_INBOX_TOKEN（与 faq.html 同源，公开页已下发）。
  const GITEE_TOK = window.GITEE_INBOX_TOKEN || ''
  const GITEE_INBOX = window.GITEE_INBOX_REPO || { owner: 'aiesse', name: 'inbox', branch: 'main', file: 'inbox.json' }
  const GITEE_WORK = window.GITEE_WORK_REPO || { owner: 'aiesse', name: 'work', branch: 'main', logs: 'data/logs.json', tracks: 'data/tracks.json' }

  // Gitee 返回的 base64 按 UTF-8 安全解码（与 faq.html 一致）
  function b64decode(b64) { return decodeURIComponent(escape(atob((b64 || '').replace(/\s/g, '')))) }

  // 从 Gitee contents API 拉取某个文件并解析为对象/数组；signal 用于超时中断。
  // 加重试：Gitee API 偶发限流/网络抖动时自动重试一次，避免偶发失败就回退到（国内常不可达的）Worker。
  async function giteeFile(repo, path, signal, tries = 2) {
    let lastErr
    for (let i = 0; i < tries; i++) {
      try {
        let url = `https://gitee.com/api/v5/repos/${repo.owner}/${repo.name}/contents/${path}?ref=${repo.branch}`
        if (GITEE_TOK) url += (url.includes('?') ? '&' : '?') + 'access_token=' + encodeURIComponent(GITEE_TOK)
        const res = await fetch(url, { cache: 'no-cache', signal })
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + path)
        const json = await res.json()
        if (!json || !json.content) throw new Error('无 content：' + path)
        return JSON.parse(b64decode(json.content))
      } catch (e) {
        lastErr = e
        if (signal && signal.aborted) throw e
        if (i < tries - 1) await new Promise((r) => setTimeout(r, 400))
      }
    }
    throw lastErr
  }

  // 复刻 Worker /progress 逻辑，纯前端经 Gitee 计算进度（国内可达）。
  async function queryViaGitee(code, signal) {
    const [inbox, logs, tracks] = await Promise.all([
      giteeFile(GITEE_INBOX, GITEE_INBOX.file || 'inbox.json', signal).catch(() => null),
      giteeFile(GITEE_WORK, GITEE_WORK.logs, signal).catch(() => null),
      giteeFile(GITEE_WORK, GITEE_WORK.tracks, signal).catch(() => null),
    ])
    if (!inbox && !logs) throw new Error('Gitee 数据源均不可用')

    const rows = Array.isArray(inbox) ? inbox : []
    let rec = rows.find((r) => String(r.matter_code || '').toUpperCase() === code)
    let source = 'inbox'
    if (!rec) {
      const ls = Array.isArray(logs) ? logs : []
      rec = ls.find((l) => String(l.matter_code || '').toUpperCase() === code)
      if (rec) source = 'logs'
    }
    if (!rec) return { found: false, reason: 'not_found' }

    const base = {
      found: true,
      matter_code: rec.matter_code,
      status: rec.status || '',
      type: rec.type || '',
      company_name: rec.company_name || '',
      district: rec.district || '',
      content: source === 'logs' ? (rec.matter || rec.content || '') : (rec.content || ''),
      created_at: source === 'logs' ? (rec.record_time || rec.created_at || '') : (rec.created_at || ''),
      attachments: source === 'logs' ? normAtts(rec.attachments) : normAtts(rec.attachment),
      started: false,
      handling_method: '',
      work_status: '',
      tracks: [],
    }

    const logId = source === 'logs' ? Number(rec.id) : Number(rec.log_id)
    if (logId) {
      const ls = Array.isArray(logs) ? logs : []
      const log = ls.find((l) => Number(l.id) === logId)
      if (log) {
        base.started = true
        base.work_status = log.status || ''
        base.handling_method = log.handling_method || ''
      }
      const ts = Array.isArray(tracks) ? tracks : []
      base.tracks = ts
        .filter((t) => Number(t.log_id) === logId)
        .map((t) => ({ record_time: t.record_time || '', content: t.content || '', attachments: normAtts(t.attachments) }))
        .sort((a, b) => String(a.record_time || '').localeCompare(String(b.record_time || '')))
    }
    return base
  }

  // 兜底：经 Worker /progress（海外可达）。
  async function queryViaWorker(code, signal) {
    if (!FAQ_WORKER) throw new Error('未配置 Worker')
    const res = await fetch(FAQ_WORKER + '/progress?code=' + encodeURIComponent(code), { cache: 'no-cache', signal })
    const text = await res.text()
    let data = null
    try { data = JSON.parse(text) } catch {}
    if (!res.ok) throw new Error('HTTP ' + res.status)
    if (!data) throw new Error('返回非 JSON')
    return data
  }

  // 带超时的请求封装
  function withTimeout(fn, ms) {
    const ctrl = new AbortController()
    const timer = setTimeout(() => ctrl.abort(), ms)
    return fn(ctrl.signal).finally(() => clearTimeout(timer))
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
  }

  // 状态着色：与系统内状态语义一致
  function statusColor(s) {
    if (!s) return ''
    if (['已办结', '已归档'].includes(s)) return 'ok'
    if (['处理中', '已受理'].includes(s)) return 'warnc'
    if (['待处理', '已退回', '审批驳回'].includes(s)) return 'bad'
    return ''
  }

  function fmtTime(t) {
    if (!t) return ''
    // 兼容 ISO 与 yyyy-MM-ddTHH:mm 等多种格式，仅展示到分钟
    const d = new Date(t)
    if (isNaN(d.getTime())) return String(t)
    const pad = (n) => String(n).padStart(2, '0')
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes())
  }

  // 从附件 URL 解析出文件名（优先取 ?name= 参数，否则取路径末段）
  function attFileName(u) {
    try {
      const p = new URL(u)
      const n = p.searchParams.get('name')
      if (n) return n
      const seg = p.pathname.split('/').pop()
      return seg || u
    } catch { return u }
  }
  const IMG_RE = /\.(png|jpe?g|gif|webp|bmp)$/i

  // 把附件字段规整为 URL 字符串数组（兼容：单字符串 / 逗号分隔字符串 / 字符串数组 / 含 url 的对象数组）
  function normAtts(a) {
    if (!a) return []
    if (typeof a === 'string') return a.split(/[,\s]+/).map((s) => s.trim()).filter(Boolean)
    if (Array.isArray(a)) {
      return a.map((x) => {
        if (typeof x === 'string') return x.trim()
        if (x && typeof x === 'object') return String(x.url || x.src || x.path || '').trim()
        return ''
      }).filter(Boolean)
    }
    if (typeof a === 'object' && a.url) return [String(a.url).trim()].filter(Boolean)
    return []
  }

  // 把附件数组渲染为缩略图（图片）或文件链接（其它），经 Worker /file 代理加载（免令牌）
  function renderAtts(atts) {
    if (!atts || !atts.length) return ''
    let html = '<div class="att-grid">'
    for (const u of atts) {
      if (!u) continue
      const name = attFileName(u)
      const isImg = IMG_RE.test(name)
      const purl = FAQ_WORKER + '/file?url=' + encodeURIComponent(u)
      if (isImg) {
        html += '<a class="att-thumb" href="' + escapeHtml(purl) + '" target="_blank" rel="noopener" title="' + escapeHtml(name) + '"><img src="' + escapeHtml(purl) + '" alt="' + escapeHtml(name) + '" loading="lazy" /></a>'
      } else {
        html += '<a class="att-file" href="' + escapeHtml(purl) + '" target="_blank" rel="noopener" title="' + escapeHtml(name) + '">📎 ' + escapeHtml(name) + '</a>'
      }
    }
    html += '</div>'
    return html
  }

  function showMsg(type, text) {
    const m = document.getElementById('msg')
    m.className = 'msg ' + type
    m.textContent = text
  }

  function renderResult(d) {
    const box = document.getElementById('result')
    const colorCls = statusColor(d.status) || statusColor(d.work_status)
    let html = '<h2>事项处理情况</h2>'
    html += '<div class="code-badge">' + escapeHtml(d.matter_code) + '</div>'

    const infoRows = [
      ['当前状态', d.status || '—', statusColor(d.status)],
      ['问题类型', d.type || '—', ''],
      ['提交时间', fmtTime(d.created_at) || '—', ''],
    ]
    for (const [k, v, c] of infoRows) {
      html += '<div class="row"><div class="k">' + k + '</div><div class="v ' + c + '">' + escapeHtml(v) + '</div></div>'
    }
    // 问题描述
    html += '<div class="row"><div class="k">问题描述</div><div class="v">' + (d.content ? escapeHtml(d.content) : '—') + '</div></div>'
    // 事项信息附件
    html += '<div class="section-title">事项附件</div>'
    html += (d.attachments && d.attachments.length)
      ? renderAtts(d.attachments)
      : '<div class="att-empty">暂无附件</div>'

    // 处理方式
    html += '<div class="section-title">处理方式</div>'
    if (d.handling_method) {
      html += '<div class="row"><div class="k">处理方式</div><div class="v">' + escapeHtml(d.handling_method) + '</div></div>'
    } else {
      html += '<div class="empty-note">' + (d.started ? '暂未填写处理方式。' : '该事项尚未开始处理，暂无处理方式。') + '</div>'
    }

    // 跟踪进度
    html += '<div class="section-title">跟踪进度</div>'
    if (d.tracks && d.tracks.length) {
      html += '<div class="timeline">'
      for (const t of d.tracks) {
        let item = '<div class="tl-item"><div class="tl-time">' + escapeHtml(fmtTime(t.record_time)) + '</div><div class="tl-content">' + escapeHtml(t.content) + '</div>'
        if (t.attachments && t.attachments.length) item += renderAtts(t.attachments)
        item += '</div>'
        html += item
      }
      html += '</div>'
    } else {
      html += '<div class="empty-note">' + (d.started ? '暂无跟踪记录。' : '该事项尚未开始处理，暂无跟踪进度。') + '</div>'
    }

    box.innerHTML = html
  }

  async function doQuery() {
    const code = document.getElementById('codeInput').value.trim().toUpperCase()
    const msg = document.getElementById('msg')
    const loading = document.getElementById('loading')
    const result = document.getElementById('result')
    const btn = document.getElementById('queryBtn')
    msg.textContent = ''; msg.className = 'msg'
    result.innerHTML = ''

    if (!code) { showMsg('err', '请输入事项编码'); return }

    // 防止重复点击；查询期间禁用按钮。
    btn.disabled = true
    loading.style.display = 'block'

    // 数据源策略：
    //   1) 优先 Gitee 直连（国内可达，避免 *.workers.dev 在大陆被拦截导致一直转圈）；
    //   2) 失败 / 超时再兜底 Worker /progress（海外可达）。
    // 每个数据源各自 15s 超时，任一返回即用；not_found 由 Gitee 权威判定，不再二次兜底。
    let data = null
    let lastErr = null
    try {
      data = await withTimeout((signal) => queryViaGitee(code, signal), 15000)
    } catch (e) { lastErr = e; data = null }

    if (!data && FAQ_WORKER) {
      try {
        data = await withTimeout((signal) => queryViaWorker(code, signal), 15000)
      } catch (e) { lastErr = e; data = null }
    }

    loading.style.display = 'none'
    btn.disabled = false

    if (data && data.found) {
      renderResult(data)
    } else if (data && data.reason === 'not_found') {
      showMsg('warn', '未查询到该事项编码对应的记录，请核对编码是否正确（区分大小写，仅含字母与数字）。')
    } else if (lastErr && lastErr.name === 'AbortError') {
      showMsg('err', '查询超时，请稍后重试或检查网络连接。')
    } else {
      showMsg('err', '查询失败，请稍后重试。')
    }
  }

  // 回车即查询
  document.getElementById('codeInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doQuery()
  })

  // HTTPS 下浏览器会拦截对 http 接口的混内容；本查询优先走 Gitee（https），失败兜底 Worker（https），一般无此问题，
  // 但提示仍保留以防 Worker 仅 http 部署。
  if (location.protocol === 'https:' && FAQ_WORKER && FAQ_WORKER.indexOf('https://') !== 0) {
    const b = document.getElementById('banner')
    b.style.display = 'block'
    b.textContent = '提示：当前为 HTTPS 安全环境，查询服务需为 HTTPS 地址，否则浏览器会拦截请求。'
  }
</script>
</body>
</html>
