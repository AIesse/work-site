<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>问题反馈 · 印章业务信息管理系统</title>
  <meta name="description" content="印章业务问题在线反馈通道：选择您所在的行政区与企业，提交遇到的问题，我们将尽快处理。" />
  <script src="./inbox-config.js"></script>
  <style>
    :root {
      --bg: #050505;
      --fg: #f5f4f0;
      --muted: rgba(245,244,240,.55);
      --faint: rgba(245,244,240,.30);
      --line: rgba(255,255,255,.10);
      --line-strong: rgba(255,255,255,.18);
      --gold: #e8b558;
      --gold-hi: #f5cd7e;
      --gold-deep: #c9871e;
      --card: rgba(255,255,255,.04);
      --ok: #4ade80;
      --err: #f87171;
      --warn: #f5cd7e;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(120% 70% at 50% -8%, rgba(232,181,88,.12), rgba(232,181,88,0) 55%),
        #050505;
      color: var(--fg);
      line-height: 1.55;
      min-height: 100vh;
    }
    .wrap { max-width: 560px; margin: 0 auto; padding: 28px 16px 56px; }
    .hero { text-align: center; padding: 26px 0 12px; }
    /* 顶部徽章：忠实还原 getrex.tv 顶部「◦ Beta coming soon · Limited seats」——脉冲圆点 + 纯白扫光文字 */
    .hero .badge {
      display: inline-flex; align-items: center; gap: 9px;
      font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase;
      margin-bottom: 16px;
      padding: 6px 16px; border-radius: 999px;
      background: rgba(255,255,255,.04); border: 1px solid var(--line-strong);
    }
    .hero .badge .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.9);
      animation: pulse 2.4s ease-in-out infinite; flex: none;
    }
    .shiny {
      color: rgba(245,244,240,.55);
      background: linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 60%);
      background-size: 200% 100%;
      -webkit-background-clip: text; background-clip: text;
      animation: shine 4.5s linear infinite;
    }
    @keyframes shine { 0% { background-position: 100%; } 100% { background-position: -100%; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .hero h1 { font-size: clamp(30px, 6.4vw, 44px); margin: 0 0 10px; letter-spacing: -.02em; font-weight: 700; }
    .hero p { font-size: 14px; color: var(--muted); margin: 0 auto; max-width: 420px; }
    .card {
      background: var(--card); border: 1px solid var(--line); border-radius: 22px;
      padding: 24px 20px; margin-top: 20px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 70px rgba(0,0,0,.5);
    }
    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; color: var(--fg); }
    label .req { color: var(--err); margin-left: 2px; }
    select, input, textarea {
      width: 100%; font-size: 15px; padding: 13px 14px;
      border: 1px solid var(--line); border-radius: 13px;
      background: rgba(255,255,255,.03); color: var(--fg);
      outline: none; transition: border-color .15s, box-shadow .15s, background .15s;
    }
    select:focus, input:focus, textarea:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(232,181,88,.18);
      background: rgba(255,255,255,.05);
    }
    textarea { resize: vertical; min-height: 120px; }
    .grp { display: flex; gap: 12px; }
    .grp > * { flex: 1; }

    /* 上传区域：点击 / 拖拽上传，统一暗金玻璃语言，避免与输入框风格割裂 */
    .upload-zone {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 7px; padding: 26px 16px; cursor: pointer; text-align: center;
      border: 1px dashed var(--line-strong); border-radius: 16px;
      background: rgba(255,255,255,.02); color: var(--muted);
      transition: border-color .15s, background .15s, box-shadow .15s;
    }
    .upload-zone:hover { border-color: rgba(232,181,88,.45); background: rgba(232,181,88,.05); }
    .upload-zone.drag { border-color: var(--gold); background: rgba(232,181,88,.10); box-shadow: 0 0 0 3px rgba(232,181,88,.15); }
    .upload-zone .uz-icon { color: var(--gold); opacity: .9; }
    .upload-zone .uz-text { font-size: 14px; font-weight: 600; color: var(--fg); }
    .upload-zone .uz-sub { font-size: 12px; color: var(--faint); }
    .upload-zone.has-file { border-style: solid; border-color: rgba(232,181,88,.35); background: rgba(232,181,88,.06); }
    #attachment { display: none; }
    button.primary {
      width: 100%; border: none; border-radius: 999px; padding: 15px;
      font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 8px;
      color: #1a1206;
      background: linear-gradient(180deg, var(--gold-hi), var(--gold));
      box-shadow: 0 8px 30px rgba(232,181,88,.22), inset 0 1px 0 rgba(255,255,255,.45);
      transition: transform .12s, box-shadow .15s, background .15s;
    }
    button.primary:active {
      background: linear-gradient(180deg, var(--gold), var(--gold-deep));
      transform: translateY(1px);
      box-shadow: 0 4px 18px rgba(232,181,88,.20), inset 0 1px 0 rgba(255,255,255,.30);
    }
    button.primary:disabled { opacity: .5; cursor: default; }
    .rate-hint { min-height: 18px; margin-top: 12px; font-size: 12.5px; color: var(--warn); text-align: center; }
    .status { margin-top: 16px; font-size: 14px; padding: 13px 15px; border-radius: 14px; display: none; line-height: 1.5; }
    .status.ok { display: block; background: rgba(74,222,128,.10); color: var(--ok); border: 1px solid rgba(74,222,128,.30); }
    .status.err { display: block; background: rgba(248,113,113,.10); color: var(--err); border: 1px solid rgba(248,113,113,.30); }
    .status.loading { display: block; background: rgba(232,181,88,.10); color: var(--gold-hi); border: 1px solid rgba(232,181,88,.30); }
    .status.warn { display: block; background: rgba(245,205,126,.10); color: var(--gold-hi); border: 1px solid rgba(245,205,126,.30); }
    .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 24px; line-height: 1.8; }
    .backbar { display: flex; justify-content: center; gap: 10px; margin: 16px 0 2px; }
    .ghost-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 999px;
      padding: 9px 18px; text-decoration: none; transition: color .15s, border-color .15s, background .15s;
    }
    .ghost-btn:hover { color: var(--gold); border-color: rgba(232,181,88,.40); background: rgba(232,181,88,.08); }
    .ghost-btn:active { background: rgba(232,181,88,.14); }
    .ghost-btn .arrow { transition: transform .15s; }
    .ghost-btn:hover .arrow { transform: translateX(3px); }
    .hp { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    .att-hint { margin-top: 8px; font-size: 12.5px; color: var(--muted); min-height: 16px; display: flex; align-items: center; gap: 6px; }
    .att-hint .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); flex: none; }
    .att-hint .x { margin-left: auto; color: var(--err); cursor: pointer; font-weight: 600; padding: 0 4px; }
    .att-hint .x:hover { text-decoration: underline; }

    /* 提交成功后的「事项编码」卡片：醒目展示，提示保存并附进度查询入口 */
    .code-card { margin-top: 18px; padding: 20px 18px; border-radius: 18px; background: rgba(232,181,88,.08); border: 1px solid rgba(232,181,88,.28); text-align: center; }
    .code-card .cc-label { font-size: 13px; color: var(--muted); }
    .code-card .cc-value { font-size: 32px; font-weight: 700; letter-spacing: 4px; color: var(--gold); margin: 10px 0 6px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; word-break: break-all; }
    .code-card .cc-tip { font-size: 13px; color: var(--warn); margin-bottom: 16px; line-height: 1.5; }
    .code-card .cc-actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .code-card button.copy { background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--gold-hi); border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s; }
    .code-card button.copy:active { background: rgba(232,181,88,.14); border-color: rgba(232,181,88,.4); }
    .code-card a.qbtn { display: inline-flex; align-items: center; gap: 6px; color: #1a1206; border-radius: 999px; padding: 10px 20px; font-size: 14px; font-weight: 700; text-decoration: none; background: linear-gradient(180deg, var(--gold-hi), var(--gold)); box-shadow: 0 6px 22px rgba(232,181,88,.22), inset 0 1px 0 rgba(255,255,255,.4); transition: background .15s; }
    .code-card a.qbtn:hover { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); }
    .code-card a.qbtn:active { background: linear-gradient(180deg, var(--gold), var(--gold-deep)); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <span class="badge"><span class="dot"></span><span class="shiny">印章业务 · 在线反馈</span></span>
      <h1>问题反馈</h1>
      <p>请选择您所在的行政区与企业，填写问题后提交，我们将尽快为您处理。</p>
    </div>

    <div class="backbar">
      <a class="ghost-btn" href="progress-query.html">
        进度查询
        <span class="arrow">→</span>
      </a>
      <a class="ghost-btn" href="faq.html">
        常见问题解答
        <span class="arrow">→</span>
      </a>
    </div>

    <div class="card">
      <form id="form" autocomplete="on" novalidate>
        <div class="field">
          <label for="district">行政区<span class="req">*</span></label>
          <select id="district"><option value="">请选择行政区</option></select>
        </div>
        <div class="field">
          <label for="company">企业名称<span class="req">*</span></label>
          <select id="company"><option value="">请先选择行政区</option></select>
        </div>
        <div class="grp">
          <div class="field">
            <label for="contact">联系人<span class="req">*</span></label>
            <input id="contact" type="text" placeholder="您的姓名" autocomplete="name" />
          </div>
          <div class="field">
            <label for="phone">联系电话<span class="req">*</span></label>
            <input id="phone" type="tel" placeholder="手机号码" autocomplete="tel" />
          </div>
        </div>
        <div class="field">
          <label for="ptype">问题类型</label>
          <select id="ptype">
            <option value="软件问题">软件问题</option>
            <option value="硬件问题">硬件问题</option>
            <option value="备案问题">备案问题</option>
            <option value="缴销问题">缴销问题</option>
            <option value="其他">其他</option>
            <option value="意见建议">意见建议</option>
          </select>
        </div>
        <div class="field">
          <label for="content">问题内容<span class="req">*</span></label>
          <textarea id="content" placeholder="请详细描述您遇到的问题（如：某某功能无法使用、数据异常等）…"></textarea>
        </div>
        <div class="field">
          <label for="attachment">附件（可选）</label>
          <div class="upload-zone" id="uploadZone">
            <input id="attachment" type="file" />
            <svg class="uz-icon" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 16V7" /><path d="M8 11l4-4 4 4" /><path d="M5 18a4 4 0 0 1 .8-7.92 5.5 5.5 0 0 1 10.68-1.1A3.8 3.8 0 0 1 18.5 18H5z" />
            </svg>
            <div class="uz-text" id="uzText">点击或拖拽文件到此处上传</div>
            <div class="uz-sub" id="uzSub">支持图片 / 文档，单个 ≤ 3MB</div>
          </div>
          <div id="attHint" class="att-hint"></div>
        </div>

        <!-- 基础防护：蜜罐字段，正常用户不可见，仅机器人自动填充；命中则视为垃圾提交 -->
        <input class="hp" id="hp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" />

        <button class="primary" id="submitBtn" type="submit">提交问题</button>
        <div class="rate-hint" id="rateHint"></div>

        <div class="status" id="status"></div>

        <!-- 提交成功后展示的事项编码卡片（默认隐藏，成功时填充并显隐） -->
        <div class="code-card" id="codeCard" style="display:none">
          <div class="cc-label">您的事项编码</div>
          <div class="cc-value" id="ccValue"></div>
          <div class="cc-tip">请妥善保存此编码，凭它可在「进度查询」页随时查询处理进度。</div>
          <div class="cc-actions">
            <button type="button" class="copy" id="ccCopy">复制编码</button>
            <a class="qbtn" id="ccQuery" href="progress-query.html">前往进度查询 →</a>
          </div>
        </div>
      </form>
    </div>

    <div class="foot">
      本页面由印章业务信息管理系统提供 · 提交即表示您同意我们处理上述信息用于问题跟进<br/>
      为保障服务质量，同一浏览器每分钟仅可提交一次。
    </div>
  </div>

  <script>
    // ===== 双源配置（Gitee 默认 + GitHub 兜底，由 inbox-config.js 注入）=====
    //   INBOX_SOURCE = 'gitee' | 'github'：主源（默认 gitee，国内访问快）
    //   主源失败时自动回退另一源，保证提交链路可用
    const GH_API = 'https://api.github.com'
    const GITEE_API = 'https://gitee.com/api/v5'
    const GH_REPO = window.INBOX_REPO || { owner: 'AIesse', name: 'inbox', branch: 'main', file: 'inbox.json' }
    const GITEE_REPO = window.GITEE_INBOX_REPO || { owner: 'aiesse', name: 'inbox', branch: 'main', file: 'inbox.json' }
    const GH_TOKEN = window.INBOX_TOKEN || ''
    const GITEE_TOKEN = window.GITEE_INBOX_TOKEN || ''
    const PRIMARY_SOURCE = window.INBOX_SOURCE === 'github' ? 'github' : 'gitee'
    // 频次防护：同一浏览器每分钟仅允许提交一次（基于本地时间戳，刷新后仍生效）。
    const COOLDOWN_MS = 60 * 1000
    const LAST_KEY = 'inbox_last_submit_ts'
    // 附件大小上限：3MB，超出提示并阻止提交。
    const MAX_ATT_BYTES = 3 * 1024 * 1024
    let attOversize = false

    const $ = (id) => document.getElementById(id)
    const districtSel = $('district'), companySel = $('company')
    const contactEl = $('contact'), phoneEl = $('phone'), ptypeEl = $('ptype'), contentEl = $('content')
    const attachmentEl = $('attachment'), attHint = $('attHint')
    const hpEl = $('hp')
    const statusEl = $('status'), submitBtn = $('submitBtn'), rateHint = $('rateHint'), formEl = $('form')

    function fmtSize(n) {
      if (!n && n !== 0) return ''
      if (n < 1024) return n + ' B'
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB'
      return (n / 1024 / 1024).toFixed(2) + ' MB'
    }
    // 选中附件后即时显示文件名/大小，便于确认已选；超出 3MB 时给出醒目警示。
    function renderAttHint() {
      const f = attachmentEl.files && attachmentEl.files[0]
      const uzText = $('uzText'), uzSub = $('uzSub'), zone = $('uploadZone')
      if (!f) {
        attHint.innerHTML = ''; attOversize = false
        if (zone) zone.classList.remove('has-file')
        if (uzText) uzText.textContent = '点击或拖拽文件到此处上传'
        if (uzSub) uzSub.textContent = '支持图片 / 文档，单个 ≤ 3MB'
        return
      }
      const oversize = f.size > MAX_ATT_BYTES
      attOversize = oversize
      if (oversize) {
        attHint.innerHTML =
          '<span class="dot" style="background:var(--err)"></span>' +
          '<span style="color:var(--err)">' + f.name + '（' + fmtSize(f.size) + '）超出 3MB 限制</span>' +
          '<span class="x" id="attClear" title="移除附件">✕</span>'
      } else {
        attHint.innerHTML =
          '<span class="dot"></span><span>' + f.name + '（' + fmtSize(f.size) + '）</span>' +
          '<span class="x" id="attClear" title="移除附件">✕</span>'
      }
      if (zone) zone.classList.add('has-file')
      if (uzText) uzText.textContent = '已选择：' + f.name
      if (uzSub) uzSub.textContent = fmtSize(f.size) + (oversize ? ' · 超出 3MB 限制' : ' · 点击可重新选择')
      const clear = $('attClear')
      if (clear) clear.addEventListener('click', () => { attachmentEl.value = ''; renderAttHint() })
    }
    attachmentEl.addEventListener('change', renderAttHint)

    // 上传区域：点击选文件 + 拖拽放入（统一为暗金玻璃语言，替代原生 file 控件）
    const uploadZone = $('uploadZone')
    if (uploadZone) {
      uploadZone.addEventListener('click', (e) => {
        if (e.target.classList.contains('x')) return
        attachmentEl.click()
      })
      ;['dragenter', 'dragover'].forEach((ev) =>
        uploadZone.addEventListener(ev, (e) => { e.preventDefault(); uploadZone.classList.add('drag') }))
      ;['dragleave', 'drop'].forEach((ev) =>
        uploadZone.addEventListener(ev, (e) => { e.preventDefault(); if (ev === 'drop' || e.target === uploadZone) uploadZone.classList.remove('drag') }))
      uploadZone.addEventListener('drop', (e) => {
        const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]
        if (!f) return
        const dt = new DataTransfer()
        dt.items.add(f)
        attachmentEl.files = dt.files
        renderAttHint()
      })
    }

    // 复制事项编码：写入剪贴板并短暂反馈
    const ccCopy = $('ccCopy')
    if (ccCopy) {
      ccCopy.addEventListener('click', async () => {
        const code = $('ccValue').textContent || ''
        if (!code) return
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(code)
          } else {
            const ta = document.createElement('textarea')
            ta.value = code; ta.style.position = 'fixed'; ta.style.opacity = '0'
            document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta)
          }
          const old = ccCopy.textContent
          ccCopy.textContent = '已复制 ✓'
          setTimeout(() => { ccCopy.textContent = old }, 1500)
        } catch {
          ccCopy.textContent = '复制失败'
          setTimeout(() => { ccCopy.textContent = '复制编码' }, 1500)
        }
      })
    }

    let ENTERPRISES = []
    let cooldownTimer = null

    function setStatus(type, msg) {
      statusEl.className = 'status ' + type
      statusEl.textContent = msg
    }

    function getRemaining() {
      const last = Number(localStorage.getItem(LAST_KEY) || 0)
      if (!last) return 0
      const remain = COOLDOWN_MS - (Date.now() - last)
      return remain > 0 ? remain : 0
    }

    // 刷新提交按钮与频次提示：冷却期内禁用按钮并显示倒计时，结束后恢复。
    function renderCooldown() {
      if (cooldownTimer) { clearTimeout(cooldownTimer); cooldownTimer = null }
      const remain = getRemaining()
      if (remain > 0) {
        const sec = Math.ceil(remain / 1000)
        submitBtn.disabled = true
        submitBtn.textContent = '请稍候（' + sec + 's）'
        rateHint.textContent = '提交较频繁，为保障服务，每分钟仅可提交 1 次，请于 ' + sec + ' 秒后再试。'
        cooldownTimer = setTimeout(renderCooldown, 500)
      } else {
        submitBtn.disabled = false
        submitBtn.textContent = '提交问题'
        rateHint.textContent = ''
      }
    }

    function b64encode(str) { return btoa(unescape(encodeURIComponent(str))) }
    function b64decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))) }

    // 按指定源发请求：github 走 Authorization Bearer；gitee 走 access_token 参数
    async function callSource(source, method, path, body) {
      const isGitee = source === 'gitee'
      const apiBase = isGitee ? GITEE_API : GH_API
      const token = isGitee ? GITEE_TOKEN : GH_TOKEN
      let url = apiBase + path
      const headers = { Accept: isGitee ? 'application/json' : 'application/vnd.github+json' }
      if (!isGitee) {
        headers['Authorization'] = 'Bearer ' + token
        headers['X-GitHub-Api-Version'] = '2022-11-28'
      } else {
        // Gitee：access_token 通过 query 参数注入（与 sync.js 实现一致）
        const sep = url.includes('?') ? '&' : '?'
        url = url + sep + 'access_token=' + encodeURIComponent(token)
      }
      const opts = { method: method || 'GET', headers }
      if (body) {
        opts.headers = { ...opts.headers, 'Content-Type': 'application/json' }
        opts.body = JSON.stringify(body)
      }
      const r = await fetch(url, opts)
      const text = await r.text()
      let json = null
      try { json = text ? JSON.parse(text) : null } catch {}
      return { status: r.status, json, text }
    }

    // 取某源的 inbox 仓库上下文
    function repoOf(source) { return source === 'gitee' ? GITEE_REPO : GH_REPO }

    // 在指定源上读取 inbox.json
    async function getInboxOn(source) {
      const repo = repoOf(source)
      const res = await callSource(source, 'GET', `/repos/${repo.owner}/${repo.name}/contents/${repo.file}?ref=${repo.branch}`)
      if (res.status === 200 && res.json && res.json.content) {
        try { return { rows: JSON.parse(b64decode(res.json.content)) || [], sha: res.json.sha } } catch { return { rows: [], sha: res.json.sha } }
      }
      if (res.status === 404) return { rows: [], sha: null }
      throw new Error('读取收件箱失败 (' + source + ': ' + res.status + ')')
    }

    // 双源读取：主源失败时自动回退另一源
    async function getInbox() {
      const fallback = PRIMARY_SOURCE === 'gitee' ? 'github' : 'gitee'
      try {
        return { ...await getInboxOn(PRIMARY_SOURCE), source: PRIMARY_SOURCE }
      } catch (e) {
        try { return { ...await getInboxOn(fallback), source: fallback } } catch (e2) {
          throw new Error('两源读取均失败：' + (e.message || e) + ' / ' + (e2.message || e2))
        }
      }
    }

    function nextId(rows) {
      let max = 0
      for (const r of rows) { const v = Number(r.id); if (!Number.isNaN(v) && v > max) max = v }
      return max + 1
    }

    // 生成 6 位「英文 + 数字」混搭的唯一事项编码：
    // - 字母池排除易混淆的 I/O，数字池排除 0/1，降低客户抄写错误；
    // - 强制至少包含 1 个字母与 1 个数字（"混搭"）；
    // - 与现有记录的 matter_code 去重，保证唯一。
    const CODE_LETTERS = 'ABCDEFGHJKLMNPQRSTUVWXYZ'
    const CODE_DIGITS = '23456789'
    function genMatterCode(rows) {
      const pool = CODE_LETTERS + CODE_DIGITS
      const existing = new Set((rows || []).map((r) => String(r.matter_code || '').toUpperCase()).filter(Boolean))
      for (let attempt = 0; attempt < 200; attempt++) {
        let code = ''
        for (let i = 0; i < 6; i++) code += pool[Math.floor(Math.random() * pool.length)]
        const hasLetter = /[A-Z]/.test(code)
        const hasDigit = /[0-9]/.test(code)
        if (!hasLetter || !hasDigit) continue // 必须字母数字混搭
        if (existing.has(code)) continue // 必须唯一
        return code
      }
      // 极端兜底：强制 3 字母 + 3 数字随机排列，并加随机后缀重试（理论上不可达）
      let code = 'EP'
      for (let i = 0; i < 4; i++) code += pool[Math.floor(Math.random() * pool.length)]
      while (existing.has(code)) code += CODE_DIGITS[Math.floor(Math.random() * CODE_DIGITS.length)]
      return code
    }

    // 在指定源上写入 inbox.json（含 409 重试）
    async function putInboxOn(source, rows, sha, rec, attempt = 0) {
      const repo = repoOf(source)
      const body = { message: 'customer submit: ' + (rec.company_name || ''), content: b64encode(JSON.stringify(rows, null, 2)), branch: repo.branch }
      if (sha) body.sha = sha
      const r = await callSource(source, 'PUT', `/repos/${repo.owner}/${repo.name}/contents/${repo.file}`, body)
      if (r.status === 200 || r.status === 201) return true
      if (r.status === 409 && attempt < 3) {
        const fresh = await getInboxOn(source)
        rec.id = nextId(fresh.rows)
        fresh.rows.push(rec)
        return putInboxOn(source, fresh.rows, fresh.sha, rec, attempt + 1)
      }
      throw new Error('写入收件箱失败 (' + source + ': ' + r.status + ')')
    }

    // 双源写入：保证两源最终一致。先写主源，成功后写另一源；另一源失败不阻断提交成功。
    async function putInbox(both, rows, sha, rec) {
      // both = { source: 主源, sha: 主源 sha }
      await putInboxOn(both.source, rows, sha, rec)
      const fallback = both.source === 'gitee' ? 'github' : 'gitee'
      try {
        // 写另一源前需先取该源 sha（与本地 rows 合并写入，避免覆盖另一源上的独有数据）
        const other = await getInboxOn(fallback)
        const mergedMap = new Map(other.rows.map((r) => [String(r.id), r]))
        // 本地 rows 为主（含本次提交），覆盖同 id；新增 id 直接追加
        for (const r of rows) mergedMap.set(String(r.id), r)
        const mergedRows = [...mergedMap.values()]
        await putInboxOn(fallback, mergedRows, other.sha, rec)
      } catch (e) {
        // 另一源失败仅打印警告——主源已成功，提交视为成功
        console.warn('[inbox] 双端写入：另一源(' + fallback + ')同步失败，主源已成功，将依赖后续同步追平：', e.message || e)
      }
    }

    // 即时通知：写入成功后通知 Worker 立即向订阅端推送（零轮询延迟）。
    // 失败静默跳过——Worker 偶发不可达时由 10 分钟 cron 兜底补推，不阻塞用户提交成功提示。
    async function notifyPush() {
      const workerUrl = window.PUSH_WORKER_URL || (localStorage.getItem('ep_push_worker_url') || '')
      const secret = window.PUSH_NOTIFY_SECRET || ''
      if (!workerUrl || !secret) return
      try {
        await fetch(`${workerUrl}/notify?secret=${encodeURIComponent(secret)}`, {
          method: 'POST',
          mode: 'cors',
        })
      } catch {
        /* 通知失败不阻断提交流程 */
      }
    }

    // 附件上传：主通道直传本机存储服务（与后台管理端同一通道，浏览器 CORS 已验证）；
    // 仅当本机服务不可达时回退 Worker /upload 中继。返回 { url } 或 { error }。
    async function uploadAttachmentSmart(file) {
      const base = (window.__ATTACHMENT_BASE_URL__ || '').trim().replace(/\/+$/, '')
      const token = (window.__ATTACHMENT_TOKEN__ || '').trim()
      if (base) {
        try {
          const up = await fetch(base + '/upload', {
            method: 'POST',
            body: file,
            headers: {
              'Content-Type': file.type || 'application/octet-stream',
              'x-filename': encodeURIComponent(file.name || 'file'),
              ...(token ? { 'x-token': token } : {}),
            },
          })
          if (!up.ok) throw new Error('直传失败 (' + up.status + ')')
          const uj = await up.json()
          if (!uj || !uj.url) throw new Error('未返回附件地址')
          return { url: uj.url }
        } catch (e) {
          /* 直传失败 → 回退 Worker */
        }
      }
      // 回退：Worker /upload（?name= 传递文件名，无 x-filename 头，CORS 友好）。
      const wu = (window.PUSH_WORKER_URL || '').trim()
      const sec = (window.PUSH_NOTIFY_SECRET || '').trim()
      if (!wu || !sec) return { error: base ? '直传失败' : '未配置附件服务' }
      try {
        const up = await fetch(`${wu}/upload?secret=${encodeURIComponent(sec)}&name=${encodeURIComponent(file.name || 'file')}`, {
          method: 'POST',
          body: file,
          headers: { 'Content-Type': file.type || 'application/octet-stream' },
        })
        if (!up.ok) throw new Error('Worker 失败 (' + up.status + ')')
        const uj = await up.json()
        if (!uj || !uj.url) throw new Error('未返回附件地址')
        return { url: uj.url }
      } catch (e) {
        return { error: (e && e.message) || '上传失败' }
      }
    }

    function populateDistricts() {
      const districts = [...new Set(ENTERPRISES.map((e) => e.district).filter(Boolean))].sort()
      districtSel.innerHTML = '<option value="">请选择行政区</option>' + districts.map((d) => `<option value="${d}">${d}</option>`).join('')
    }
    function populateCompanies(district) {
      const list = ENTERPRISES.filter((e) => e.district === district)
      if (!list.length) { companySel.innerHTML = '<option value="">该区暂无企业</option>'; return }
      companySel.innerHTML = '<option value="">请选择企业</option>' + list.map((e) => `<option value="${e.code}">${e.name}</option>`).join('')
    }

    districtSel.addEventListener('change', () => populateCompanies(districtSel.value))

    formEl.addEventListener('submit', async (e) => {
      e.preventDefault()
      // 开始新的提交：收起上一次可能展示的编码卡片
      const ccHide = $('codeCard')
      if (ccHide) ccHide.style.display = 'none'
      // 蜜罐命中：疑似机器人，直接拒绝（不落库）。
      if (hpEl.value.trim()) { setStatus('err', '提交失败，请稍后重试。'); return }

      const remain = getRemaining()
      if (remain > 0) {
        setStatus('warn', '提交过于频繁，为保障服务，请于 ' + Math.ceil(remain / 1000) + ' 秒后再试。')
        renderCooldown()
        return
      }

      // 任一源令牌已配置即放行（getInbox 内部自动双源兜底）
      if (!GH_TOKEN && !GITEE_TOKEN) { setStatus('err', '服务暂未就绪，请联系管理员。'); return }

      const district = districtSel.value
      const code = companySel.value
      const company_name = companySel.options[companySel.selectedIndex]?.text || ''
      const contact_person = contactEl.value.trim()
      const contact_phone = phoneEl.value.trim()
      const content = contentEl.value.trim()

      if (!district || !code) { setStatus('err', '请选择行政区与企业'); return }
      if (!contact_person || !contact_phone) { setStatus('err', '请填写联系人与联系电话'); return }
      if (!content) { setStatus('err', '请填写问题内容'); return }

      // 附件大小校验：超出 3MB 直接拦截，提示压缩后重试
      const pendingFile = attachmentEl.files && attachmentEl.files[0]
      if (pendingFile && pendingFile.size > MAX_ATT_BYTES) {
        setStatus('err', '附件大小不能超过 3MB（当前 ' + fmtSize(pendingFile.size) + '），请压缩或移除后重试。')
        return
      }

      submitBtn.disabled = true
      setStatus('loading', '正在提交…')
      let attFailed = false
      let attErr = ''
      try {
        let { rows, sha, source } = await getInbox()

        // 附件：直传本机存储服务 files.aiesse.me（与后台管理端同一上传通道，浏览器 CORS 已验证可用）；
        // 仅当本机服务不可达时才回退 Worker /upload 中继。
        // 注：此前走 Worker（*.workers.dev 默认域名）在部分网络（如中国大陆）被屏蔽/超时，
        // 导致附件上传失败；files.aiesse.me 为自有域名，与管理站点同源可达，故改为主通道。
        // 上传在写入收件箱之前完成；失败仅跳过附件，不阻断文字提交。
        let attachment = ''
        const f = attachmentEl.files && attachmentEl.files[0]
        if (f) {
          setStatus('loading', '正在上传附件：' + f.name + '（' + fmtSize(f.size) + '）…')
          const res = await uploadAttachmentSmart(f)
          if (res && res.url) {
            attachment = res.url
            setStatus('loading', '附件已上传，正在提交问题…')
          } else {
            attFailed = true
            attErr = (res && res.error) || '未知错误'
            setStatus('warn', '附件上传失败，已跳过附件。')
          }
        }

        const rec = {
          id: nextId(rows),
          matter_code: genMatterCode(rows),
          district,
          company_name,
          company_code: code,
          contact_person,
          contact_phone,
          content,
          attachment,
          type: ptypeEl.value,
          status: '待处理',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }
        rows.push(rec)
        await putInbox({ source }, rows, sha, rec)
        // 进件入库成功：即时触发推送（fire-and-forget，不阻塞成功提示）
        notifyPush()
        localStorage.setItem(LAST_KEY, Date.now())
        const okMsg = attFailed
          ? '问题已提交成功，但附件上传失败' + (attErr ? '（' + attErr + '）' : '') + '，未随附附件。'
          : (attachment ? '提交成功！我们已收到您的问题及附件，将尽快处理。' : '提交成功！我们已收到您的问题，将尽快处理。')
        setStatus('ok', okMsg)
        // 展示事项编码卡片：提示客户妥善保存，凭此编码可查询进度
        const cc = $('codeCard'), ccVal = $('ccValue')
        if (cc && ccVal) { ccVal.textContent = rec.matter_code; cc.style.display = 'block' }
        contactEl.value = ''; phoneEl.value = ''; contentEl.value = ''
        attHint.innerHTML = ''
        attachmentEl.value = ''
        renderCooldown()
      } catch (err) {
        setStatus('err', '提交失败：' + (err.message || err))
        submitBtn.disabled = false
      }
    })

    ;(async () => {
      try {
        const res = await fetch('./enterprises.json', { cache: 'no-cache' })
        ENTERPRISES = await res.json()
        populateDistricts()
        if (getRemaining() > 0) renderCooldown()
      } catch (err) {
        setStatus('err', '加载企业目录失败：' + (err.message || err))
      }
    })()
  </script>
</body>
</html>
