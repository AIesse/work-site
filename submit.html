<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>问题提交 · 印章业务</title>
  <script src="./inbox-config.js"></script>
  <style>
    :root { --brand: #2563eb; --brand-d: #1d4ed8; --bg: #f4f6fb; --card: #fff; --line: #e5e7eb; --text: #1f2937; --muted: #6b7280; --ok: #059669; --err: #dc2626; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; }
    .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
    .hero { text-align: center; padding: 18px 0 8px; }
    .hero h1 { font-size: 22px; margin: 0 0 6px; }
    .hero p { font-size: 13px; color: var(--muted); margin: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 16px; margin-top: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .field { margin-bottom: 14px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    label .req { color: var(--err); margin-left: 2px; }
    select, input, textarea { width: 100%; font-size: 15px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--text); outline: none; transition: border-color .15s; }
    select:focus, input:focus, textarea:focus { border-color: var(--brand); }
    textarea { resize: vertical; min-height: 96px; }
    .grp { display: flex; gap: 10px; }
    .grp > * { flex: 1; }
    button.primary { width: 100%; background: var(--brand); color: #fff; border: none; border-radius: 11px; padding: 13px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 4px; }
    button.primary:active { background: var(--brand-d); }
    button.primary:disabled { opacity: .6; cursor: default; }
    .token-box { background: #fffbeb; border: 1px dashed #fcd34d; border-radius: 10px; padding: 12px; margin-top: 14px; }
    .token-box summary { font-size: 13px; color: #92400e; cursor: pointer; font-weight: 600; }
    .token-box .hint { font-size: 12px; color: var(--muted); margin: 8px 0; }
    .token-row { display: flex; gap: 8px; }
    .token-row input { flex: 1; }
    .token-row button { white-space: nowrap; padding: 0 14px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-size: 14px; cursor: pointer; }
    .status { margin-top: 14px; font-size: 14px; padding: 12px 14px; border-radius: 10px; display: none; }
    .status.ok { display: block; background: #ecfdf5; color: var(--ok); border: 1px solid #a7f3d0; }
    .status.err { display: block; background: #fef2f2; color: var(--err); border: 1px solid #fecaca; }
    .status.loading { display: block; background: #eff6ff; color: var(--brand); border: 1px solid #bfdbfe; }
    .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 22px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <h1>问题提交</h1>
      <p>请选择您所在的行政区与企业，填写问题后提交。我们将尽快处理。</p>
    </div>

    <div class="card">
      <div class="field">
        <label>行政区<span class="req">*</span></label>
        <select id="district"><option value="">请选择行政区</option></select>
      </div>
      <div class="field">
        <label>企业名称<span class="req">*</span></label>
        <select id="company"><option value="">请先选择行政区</option></select>
      </div>
      <div class="grp">
        <div class="field">
          <label>联系人<span class="req">*</span></label>
          <input id="contact" type="text" placeholder="您的姓名" />
        </div>
        <div class="field">
          <label>联系电话<span class="req">*</span></label>
          <input id="phone" type="tel" placeholder="手机号码" />
        </div>
      </div>
      <div class="field">
        <label>问题类型</label>
        <select id="ptype">
          <option value="软件问题">软件问题</option>
          <option value="硬件问题">硬件问题</option>
          <option value="备案问题">备案问题</option>
          <option value="缴销问题">缴销问题</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="field">
        <label>问题内容<span class="req">*</span></label>
        <textarea id="content" placeholder="请详细描述您遇到的问题…"></textarea>
      </div>

      <button class="primary" id="submitBtn">提交问题</button>

      <div class="token-box">
        <details id="tokenDetails">
          <summary>提交令牌（管理员配置 / 测试用）</summary>
          <div class="hint">首次使用需填入一枚具备「inbox 仓库」写入权限的 GitHub 令牌；保存后存入本机浏览器，下次免填。正式环境由管理员在 inbox-config.js 中预置，客户无需填写。</div>
          <div class="token-row">
            <input id="tokenInput" type="password" placeholder="ghp_xxx 或 github_pat_xxx" />
            <button id="saveToken">保存</button>
          </div>
        </details>
      </div>

      <div class="status" id="status"></div>
    </div>

    <div class="foot">本页面由印章业务信息管理系统提供 · 提交即表示您同意我们处理上述信息</div>
  </div>

  <script>
    const API = 'https://api.github.com'
    const REPO = window.INBOX_REPO || { owner: 'AIesse', name: 'inbox', branch: 'main', file: 'inbox.json' }
    const TOKEN_KEY = 'inbox_token'

    const $ = (id) => document.getElementById(id)
    const districtSel = $('district'), companySel = $('company')
    const contactEl = $('contact'), phoneEl = $('phone'), ptypeEl = $('ptype'), contentEl = $('content')
    const statusEl = $('status'), submitBtn = $('submitBtn')

    let ENTERPRISES = []

    function setStatus(type, msg) {
      statusEl.className = 'status ' + type
      statusEl.textContent = msg
    }

    function getToken() {
      return (localStorage.getItem(TOKEN_KEY) || window.INBOX_TOKEN || '').trim()
    }

    function b64encode(str) { return btoa(unescape(encodeURIComponent(str))) }
    function b64decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\s/g, '')))) }

    async function gh(path, opts, token) {
      const r = await fetch(API + path, {
        ...opts,
        headers: { Authorization: 'Bearer ' + token, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(opts.headers || {}) },
      })
      const text = await r.text()
      let json = null
      try { json = text ? JSON.parse(text) : null } catch {}
      return { status: r.status, json, text }
    }

    async function getInbox(token) {
      const res = await gh(`/repos/${REPO.owner}/${REPO.name}/contents/${REPO.file}?ref=${REPO.branch}`, {}, token)
      if (res.status === 200 && res.json && res.json.content) {
        try { return { rows: JSON.parse(b64decode(res.json.content)) || [], sha: res.json.sha } } catch { return { rows: [], sha: res.json.sha } }
      }
      if (res.status === 404) return { rows: [], sha: null }
      throw new Error('读取收件箱失败 (' + res.status + ')')
    }

    function nextId(rows) {
      let max = 0
      for (const r of rows) { const v = Number(r.id); if (!Number.isNaN(v) && v > max) max = v }
      return max + 1
    }

    async function putInbox(token, rows, sha, rec, attempt = 0) {
      const body = { message: 'customer submit: ' + (rec.company_name || ''), content: b64encode(JSON.stringify(rows, null, 2)), branch: REPO.branch }
      if (sha) body.sha = sha
      const r = await gh(`/repos/${REPO.owner}/${REPO.name}/contents/${REPO.file}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }, token)
      if (r.status === 200 || r.status === 201) return true
      if (r.status === 409 && attempt < 3) {
        const fresh = await getInbox(token)
        rec.id = nextId(fresh.rows)
        fresh.rows.push(rec)
        return putInbox(token, fresh.rows, fresh.sha, rec, attempt + 1)
      }
      throw new Error('写入收件箱失败 (' + r.status + ')')
    }

    function populateDistricts() {
      const districts = [...new Set(ENTERPRISES.map((e) => e.district).filter(Boolean))].sort()
      districtSel.innerHTML = '<option value="">请选择行政区</option>' + districts.map((d) => `<option value="${d}">${d}</option>`).join('')
    }
    function populateCompanies(district) {
      const list = ENTERPRISES.filter((e) => e.district === district)
      if (!list.length) { companySel.innerHTML = '<option value="">该区暂无企业</option>'; return }
      companySel.innerHTML = '<option value="">请选择企业</option>' + list.map((e) => `<option value="${e.code}">${e.name}</option>`).join('')
    }

    districtSel.addEventListener('change', () => populateCompanies(districtSel.value))

    $('saveToken').addEventListener('click', () => {
      const v = $('tokenInput').value.trim()
      if (!v) { setStatus('err', '令牌不能为空'); return }
      localStorage.setItem(TOKEN_KEY, v)
      setStatus('ok', '令牌已保存到本机浏览器')
      $('tokenDetails').open = false
    })

    submitBtn.addEventListener('click', async () => {
      const token = getToken()
      if (!token) { setStatus('err', '请先在下方「提交令牌」中填入令牌并保存'); $('tokenDetails').open = true; return }
      const district = districtSel.value, code = companySel.value, company_name = companySel.options[companySel.selectedIndex]?.text || ''
      const contact_person = contactEl.value.trim(), contact_phone = phoneEl.value.trim(), content = contentEl.value.trim()
      if (!district || !code) { setStatus('err', '请选择行政区与企业'); return }
      if (!contact_person || !contact_phone) { setStatus('err', '请填写联系人与联系电话'); return }
      if (!content) { setStatus('err', '请填写问题内容'); return }

      submitBtn.disabled = true
      setStatus('loading', '正在提交…')
      try {
        let { rows, sha } = await getInbox(token)
        const rec = {
          id: nextId(rows),
          district,
          company_name,
          company_code: code,
          contact_person,
          contact_phone,
          content,
          type: ptypeEl.value,
          status: '待处理',
          created_at: new Date().toISOString(),
          updated_at: new Date().toISOString(),
        }
        rows.push(rec)
        await putInbox(token, rows, sha, rec)
        setStatus('ok', '提交成功！我们已收到您的问题，将尽快处理。')
        // 清空表单（保留行政区/企业便于连续提交）
        contactEl.value = ''; phoneEl.value = ''; contentEl.value = ''
      } catch (e) {
        setStatus('err', '提交失败：' + (e.message || e))
      } finally {
        submitBtn.disabled = false
      }
    })

    ;(async () => {
      try {
        const res = await fetch('./enterprises.json', { cache: 'no-cache' })
        ENTERPRISES = await res.json()
        populateDistricts()
        const saved = localStorage.getItem(TOKEN_KEY)
        if (saved) { $('tokenInput').value = saved; setStatus('ok', '已使用本机保存的提交令牌') }
      } catch (e) {
        setStatus('err', '加载企业目录失败：' + (e.message || e))
      }
    })()
  </script>
</body>
</html>
