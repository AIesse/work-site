<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>印章备案信息查询</title>
<style>
  :root {
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #1f2937;
    --muted: #6b7280;
    --line: #e5e7eb;
    --primary: #2563eb;
    --primary-d: #1d4ed8;
    --ok: #059669;
    --warn: #d97706;
    --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --card: #17191e;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --line: #2a2d34;
      --primary: #3b82f6;
      --primary-d: #2563eb;
      --ok: #10b981;
      --warn: #f59e0b;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 680px; margin: 0 auto; padding: 20px 16px 48px; }
  header {
    background: linear-gradient(135deg, var(--primary), #4f46e5);
    color: #fff;
    border-radius: 18px;
    padding: 22px 22px 24px;
    box-shadow: 0 10px 30px -12px rgba(37, 99, 235, .5);
  }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  header p { margin: 6px 0 0; font-size: 13px; opacity: .9; }
  .back { display: inline-block; margin-top: 14px; font-size: 13px; color: #fff; opacity: .85; text-decoration: none; }
  .back:hover { opacity: 1; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    margin-top: 18px;
    box-shadow: 0 4px 18px -10px rgba(0,0,0,.18);
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab {
    flex: 1; text-align: center; padding: 9px 0; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;
    border: 1px solid var(--line); color: var(--muted); background: transparent;
    transition: all .15s ease;
  }
  .tab.active { color: #fff; background: var(--primary); border-color: var(--primary); }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
  input[type=text] {
    width: 100%; padding: 11px 13px; font-size: 15px;
    border: 1px solid var(--line); border-radius: 10px;
    background: transparent; color: var(--text); outline: none;
    transition: border-color .15s ease;
  }
  input[type=text]:focus { border-color: var(--primary); }
  .captcha-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .captcha-row input { flex: 1; min-width: 0; }
  .captcha-img {
    height: 46px; width: 124px; flex-shrink: 0; object-fit: cover; border-radius: 10px;
    border: 1px solid var(--line); cursor: pointer; background: #f3f4f6;
  }
  .captcha-err { font-size: 12px; color: var(--warn); }
  .area-note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  button.query {
    width: 100%; margin-top: 18px; padding: 13px; font-size: 15px; font-weight: 700;
    color: #fff; background: var(--primary); border: none; border-radius: 12px; cursor: pointer;
    transition: background .15s ease;
  }
  button.query:hover { background: var(--primary-d); }
  button.query:disabled { opacity: .6; cursor: default; }
  .msg { margin-top: 14px; padding: 11px 13px; border-radius: 10px; font-size: 14px; }
  .msg.err { background: rgba(220,38,38,.08); color: var(--err); border: 1px solid rgba(220,38,38,.25); }
  .msg.warn { background: rgba(217,119,6,.08); color: var(--warn); border: 1px solid rgba(217,119,6,.25); }
  .spinner {
    width: 22px; height: 22px; margin: 18px auto; border: 3px solid var(--line);
    border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result { margin-top: 16px; }
  .result h2 { font-size: 16px; margin: 0 0 8px; }
  .row {
    display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .row:last-child { border-bottom: none; }
  .row .k { width: 116px; flex-shrink: 0; text-align: right; color: var(--muted); }
  .row .v { flex: 1; word-break: break-all; }
  .v.ok { color: var(--ok); font-weight: 600; }
  .v.bad { color: var(--err); font-weight: 600; }
  .v.warnc { color: var(--warn); font-weight: 600; }
  .disclaimer { margin-top: 18px; font-size: 12px; color: var(--muted); text-align: center; }
  .banner {
    margin-top: 16px; padding: 11px 13px; border-radius: 10px; font-size: 13px;
    background: rgba(217,119,6,.08); color: var(--warn); border: 1px solid rgba(217,119,6,.25);
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🔍 印章备案信息查询</h1>
      <p>淄博市公章备案信息查询工具 · 支持两种查询方式</p>
      <a class="back" href="./">← 返回工作台</a>
    </header>

    <div class="card">
      <div class="tabs">
        <div class="tab active" data-mode="name" onclick="switchMode('name')">按印章名称</div>
        <div class="tab" data-mode="code" onclick="switchMode('code')">按印章编码</div>
      </div>

      <label id="inputLabel">印章名称</label>
      <input type="text" id="queryInput" placeholder="请输入印章名称" autocomplete="off" />

      <label>验证码</label>
      <div class="captcha-row">
        <input type="text" id="vcode" placeholder="请输入验证码" autocomplete="off" />
        <img id="captchaImg" class="captcha-img" alt="验证码" title="点击刷新验证码" />
      </div>
      <div id="captchaErr" class="captcha-err" style="display:none"></div>
      <div class="area-note">查询区域：淄博市（区域代码 370300）</div>

      <button class="query" id="queryBtn" onclick="doQuery()">查询</button>

      <div id="banner" class="banner" style="display:none"></div>
      <div id="loading" class="spinner" style="display:none"></div>
      <div id="msg"></div>
      <div id="result" class="result"></div>
    </div>

    <div class="disclaimer">印章查询结果作为查询印章备案信息的辅助手段，不作为法律依据，特此声明！</div>
  </div>

<script>
  const API_BASE = 'http://60.210.113.134:5867/beian-api'
  const AREA_CODE = '370300'

  const SEAL_TYPE_DICT = {
    '01': '法定名称章', '02': '财务专用章', '03': '发票专用章',
    '04': '合同专用章', '05': '法定代表人名章', '99': '其他类型印章'
  }
  const SEAL_STATUS_DICT = {
    '01': '已备案', '02': '已承接', '03': '已制作', '04': '已交付', '05': '已报废',
    '06': '已缴销', '07': '已挂失', '08': '未备案', '09': '已受理', '20': '待注销',
    '21': '退回', '22': '超期未领章', '23': '审批驳回', '24': '已冻结', '25': '已退回',
    '26': '已撤销', '27': '审批通过', '28': '取消制作', '29': '已上传', '30': '已注销',
    '66': '未受理'
  }
  const FIELD_META = {
    strSealName:   { label: '印章名称', kind: 'text' },
    strSealType:   { label: '印章类型', kind: 'type' },
    strUnitName:   { label: '使用单位', kind: 'text' },
    strUnitNamer:  { label: '备案机关', kind: 'text' },
    dtProduceDate: { label: '制作时间', kind: 'text' },
    strSealStatus: { label: '实物印章状态', kind: 'status' },
    dtDeliveDateEseal: { label: '电子印章领取时间', kind: 'text' },
    strSealStatusEseal: { label: '电子印章状态', kind: 'status' }
  }

  const BASE66 = 'ABCDEFGHIJ!0123456789.KLMNOPQRSTUVWXYZ_abcdefghijklmn@opqrstuvwxyz'
  function tsToBase66(ts) {
    let num = ts, out = ''
    if (num === 0) return BASE66[0]
    while (num > 0) { out = BASE66[num % 66] + out; num = Math.floor(num / 66) }
    return out
  }

  let vkey = ''
  let mode = 'name'

  function switchMode(m) {
    mode = m
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m))
    const label = document.getElementById('inputLabel')
    const input = document.getElementById('queryInput')
    if (m === 'name') { label.textContent = '印章名称'; input.placeholder = '请输入印章名称' }
    else { label.textContent = '印章编码'; input.placeholder = '请输入印章编码' }
    document.getElementById('msg').textContent = ''
    document.getElementById('result').innerHTML = ''
  }

  function refreshCaptcha() {
    vkey = String(Date.now() * (parseInt(Math.random() * 1000) + 1))
    const credential = tsToBase66(Date.now())
    const img = document.getElementById('captchaImg')
    const err = document.getElementById('captchaErr')
    err.style.display = 'none'
    img.onerror = () => { err.textContent = '验证码加载失败（服务不可达或被浏览器拦截）'; err.style.display = 'block' }
    img.src = API_BASE + '/modules/vcode/img?vkey=' + encodeURIComponent(vkey) + '&credential=' + encodeURIComponent(credential)
  }

  function fmtValue(key, value) {
    if (value === null || value === undefined || value === '') return '—'
    const meta = FIELD_META[key]
    const kind = meta ? meta.kind : 'text'
    if (kind === 'type') return SEAL_TYPE_DICT[value] || value
    if (kind === 'status') return SEAL_STATUS_DICT[value] || value
    if (typeof value === 'object') { try { return JSON.stringify(value) } catch { return String(value) } }
    return String(value)
  }

  function statusColor(status) {
    if (!status) return ''
    if (status === '01') return 'ok'
    if (['08','20','05','06','07','25','24','28','66'].includes(status)) return 'bad'
    return 'warnc'
  }

  function renderResult(result) {
    const box = document.getElementById('result')
    let html = '<h2>印章备案信息</h2>'
    for (const [k, v] of Object.entries(result)) {
      const meta = FIELD_META[k]
      const label = meta ? meta.label : k
      const kind = meta ? meta.kind : 'text'
      const text = fmtValue(k, v)
      const colorCls = kind === 'status' ? statusColor(v) : ''
      html += '<div class="row"><div class="k">' + label + '</div><div class="v ' + colorCls + '">' + escapeHtml(text) + '</div></div>'
    }
    box.innerHTML = html
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]))
  }

  async function doQuery() {
    const input = document.getElementById('queryInput').value.trim()
    const vcode = document.getElementById('vcode').value.trim()
    const msg = document.getElementById('msg')
    const loading = document.getElementById('loading')
    const result = document.getElementById('result')
    msg.textContent = ''; msg.className = 'msg'
    result.innerHTML = ''

    if (!input) { msg.className = 'msg err'; msg.textContent = (mode === 'name' ? '请输入印章名称' : '请输入印章编码'); return }
    if (!vcode) { msg.className = 'msg err'; msg.textContent = '请输入验证码'; return }

    const params = new URLSearchParams({
      vcode: vcode,
      vkey: vkey,
      strAreaCodes: AREA_CODE
    })
    if (mode === 'name') params.set('strSealName', input)
    else params.set('strSealCode', input)

    loading.style.display = 'block'
    try {
      const res = await fetch(API_BASE + '/modules/sealData/detailByNameAndAreaCode/public?' + params.toString(), { method: 'GET' })
      const text = await res.text()
      let data = null
      try { data = JSON.parse(text) } catch {}
      refreshCaptcha()
      if (!res.ok) { msg.className = 'msg err'; msg.textContent = '查询请求失败（HTTP ' + res.status + '）'; return }
      if (data && data.code === 200 && data.result) {
        renderResult(data.result)
      } else {
        msg.className = 'msg err'
        msg.textContent = (data && (data.message || data.msg)) || '未查询到该印章的备案信息'
      }
    } catch (e) {
      refreshCaptcha()
      msg.className = 'msg err'
      msg.textContent = '网络错误，请稍后重试（当前环境可能无法访问外部 HTTP 接口）'
    } finally {
      loading.style.display = 'none'
    }
  }

  // HTTPS / PWA 安全上下文下，浏览器会拦截对 http:// 接口的「混合内容」请求
  if (window.isSecureContext) {
    const b = document.getElementById('banner')
    b.style.display = 'block'
    b.textContent = '提示：当前为 HTTPS 安全环境，浏览器会禁止混合内容访问（无法直连外部 HTTP 接口）。如需查询请在本机 http:// 环境打开本页，或待接口提供 HTTPS 后使用。'
  }

  refreshCaptcha()
</script>
</body>
</html>
