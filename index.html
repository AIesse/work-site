<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>印章业务信息管理系统</title>
    <!-- 双前端入口分流：本入口为 shadcn 新版界面；若用户选择了「经典原版」，
         在加载任何 JS 之前直接切到 classic.html（src/legacy 那套原样保留的经典前端），
         避免多下载一份用不到的包、也避免两套样式在同一页面里打架。 -->
    <script>
      if (localStorage.getItem('ep_style') === 'legacy') window.location.replace('./classic.html')
    </script>
    <script>
      // 判定是否运行在「独立应用」模式（添加到主屏幕的 PWA）。iOS 26/27 的独立应用里，
      // 布局视口只到「可用区」底边，屏幕最下方的 Home Indicator 手势区会露出系统黑底 → 底部一条黑边。
      // 这里打上标记，由 CSS 决定是否显示底部磨砂补白条（普通浏览器 Safari 的 100vh 含工具栏区，必须区分）。
      try {
        var sa = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        if (sa) document.documentElement.classList.add('pwa-standalone')
      } catch (e) { /* noop */ }
    </script>
    <script type="module" crossorigin src="./assets/main-Br9PtT93.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/theme-CZ3xfSgk.js">
    <link rel="stylesheet" crossorigin href="./assets/main-uCfShbFY.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- iOS 独立应用底部手势区补白：铺满整屏的容器把磨砂条顶到屏幕物理底边，
         默认不显示，仅 html.pwa-standalone 时由 CSS 启用（见 index.css .app-bottom-safe）。 -->
    <div class="app-bottom-safe" aria-hidden="true"><div class="app-bottom-safe-bar"></div></div>
    <!-- 注入附件服务器配置（__ATTACHMENT_BASE_URL__ / __ATTACHMENT_TOKEN__ 等）：
         必须在主模块前加载，使 attachmentServer.getAttachmentBaseUrl() 能取到本地优先地址，
         否则 base 为空会直奔 GitHub 兜底。与 submit.html 保持一致。 -->
    <script src="./inbox-config.js"></script>
  </body>
</html>
