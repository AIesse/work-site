<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>印章业务信息管理系统</title>
    <!-- 双前端入口分流：本入口为 shadcn 新版界面；若用户选择了「经典原版」，
         在加载任何 JS 之前直接切到 classic.html（src/legacy 那套原样保留的经典前端），
         避免多下载一份用不到的包、也避免两套样式在同一页面里打架。 -->
    <script>
      if (localStorage.getItem('ep_style') === 'legacy') window.location.replace('./classic.html')
    </script>
    <script>
      // 首屏前置标记：是否「独立应用」模式（添加到主屏幕的 PWA）。
      // 真正的视口管理（高度/安全区/软键盘/iOS 视口自愈）全部由 src/lib/viewport.js 统一负责，
      // 这里只为了首屏渲染前就有正确的 class，避免闪烁；该模块启动时会再确认一次。
      try {
        var sa = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
        if (sa) document.documentElement.classList.add('pwa-standalone')
      } catch (e) { /* noop */ }
    </script>
    <script type="module" crossorigin src="./assets/main-g-oZlqcZ.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/theme-CZ3xfSgk.js">
    <link rel="stylesheet" crossorigin href="./assets/main-BiMWhV_3.css">
  </head>
  <body>
    <div id="root"></div>
    <!-- 注入附件服务器配置（__ATTACHMENT_BASE_URL__ / __ATTACHMENT_TOKEN__ 等）：
         必须在主模块前加载，使 attachmentServer.getAttachmentBaseUrl() 能取到本地优先地址，
         否则 base 为空会直奔 GitHub 兜底。与 submit.html 保持一致。 -->
    <script src="./inbox-config.js"></script>
  </body>
</html>
