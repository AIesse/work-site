<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>问题解答 · 印章业务信息管理系统</title>
  <meta name="description" content="印章业务常见问题解答：实时整理自归档工作记录，可按主题或相近主题搜索匹配。" />
  <!-- FAQ 数据源配置：默认从 Gitee contents API 拉取（国内访问快），失败回退 GitHub contents API、本地 ./faq.json、Worker。
       令牌与 inbox 共用（见 inbox-config.js 的 GITEE_INBOX_TOKEN / INBOX_TOKEN），work-site 为公开仓。 -->
  <script src="./inbox-config.js"></script>
  <script src="./faq-config.js"></script>
  <style>
    :root { --bg: #050505; --fg: #f5f4f0; --muted: rgba(245,244,240,.55); --faint: rgba(245,244,240,.30); --line: rgba(255,255,255,.10); --line-strong: rgba(255,255,255,.18); --gold: #e8b558; --gold-hi: #f5cd7e; --gold-deep: #c9871e; --card: rgba(255,255,255,.04); --ok: #4ade80; --err: #f87171; --warn: #f5cd7e; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--fg); line-height: 1.6; min-height: 100vh; background: radial-gradient(120% 70% at 50% -8%, rgba(232,181,88,.12), rgba(232,181,88,0) 55%), #050505; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 56px; }
    .hero { text-align: center; padding: 26px 0 12px; }
    /* 顶部徽章：与 submit 反馈页一致——脉冲圆点 + 纯白扫光文字 + 金边 */
    .hero .badge { display: inline-flex; align-items: center; gap: 9px; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px; padding: 6px 16px; border-radius: 999px; background: rgba(255,255,255,.04); border: 1px solid var(--line-strong); }
    .hero .badge .dot { width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 12px rgba(255,255,255,.9); animation: pulse 2.4s ease-in-out infinite; flex: none; }
    .shiny { color: rgba(245,244,240,.55); background: linear-gradient(120deg, rgba(255,255,255,0) 40%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 60%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; animation: shine 4.5s linear infinite; }
    @keyframes shine { 0% { background-position: 100%; } 100% { background-position: -100%; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
    .hero h1 { font-size: clamp(30px, 6.4vw, 44px); margin: 0 0 10px; letter-spacing: -.02em; font-weight: 700; }
    .hero p { font-size: 14px; color: var(--muted); margin: 0 auto; max-width: 420px; }

    .backbar { display: flex; justify-content: center; margin: 16px 0 4px; }
    .ghost-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 14px; font-weight: 600; color: var(--muted);
      background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 999px;
      padding: 9px 18px; text-decoration: none; transition: color .15s, border-color .15s, background .15s;
    }
    .ghost-btn:hover { color: var(--gold); border-color: rgba(232,181,88,.40); background: rgba(232,181,88,.08); }
    .ghost-btn:active { background: rgba(232,181,88,.14); }
    .ghost-btn .arrow { transition: transform .15s; }
    .ghost-btn:hover .arrow { transform: translateX(3px); }

    /* 搜索区 */
    .search-card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 18px; margin-top: 18px; -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 70px rgba(0,0,0,.5); }
    .search-box { position: relative; }
    .search-box svg { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-box input {
      width: 100%; font-size: 15px; padding: 14px 14px 14px 44px;
      border: 1px solid var(--line); border-radius: 13px; background: rgba(255,255,255,.03); color: var(--fg); outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    .search-box input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(232,181,88,.18); background: rgba(255,255,255,.05); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      font-size: 13px; padding: 7px 14px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,.03); border: 1px solid var(--line); color: var(--muted); transition: all .15s;
      user-select: none;
    }
    .chip:hover { border-color: rgba(232,181,88,.40); color: var(--gold); }
    .chip.active { background: linear-gradient(180deg, var(--gold-hi), var(--gold)); border-color: transparent; color: #1a1206; font-weight: 700; }

    .meta { text-align: center; font-size: 12.5px; color: var(--muted); margin: 16px 0 4px; }
    .result-tag { color: var(--gold); font-weight: 600; }
    .src-tag { color: var(--ok); font-weight: 600; }

    /* 问答列表 */
    .qa-list { margin-top: 8px; display: flex; flex-direction: column; gap: 12px; }
    .qa {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
      transition: border-color .15s, box-shadow .15s;
    }
    .qa.open { border-color: rgba(232,181,88,.45); box-shadow: 0 4px 20px rgba(232,181,88,.14); }
    .qa-head {
      display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left;
      background: none; border: none; cursor: pointer; padding: 16px 18px; font: inherit; color: var(--fg);
    }
    .qa-head:active { background: rgba(255,255,255,.03); }
    .qa-topic {
      flex: none; font-size: 11.5px; font-weight: 600; color: var(--gold);
      background: rgba(232,181,88,.12); border: 1px solid rgba(232,181,88,.30); border-radius: 999px; padding: 3px 9px; margin-top: 2px; white-space: nowrap;
    }
    /* 问题文本：允许长串（编号/URL）换行，避免横向溢出穿模 */
    .qa-q { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.45; word-break: break-word; overflow-wrap: anywhere; color: var(--fg); }
    .qa-qq { color: var(--err); font-weight: 700; }
    .qa-chev { flex: none; color: var(--muted); margin-top: 3px; transition: transform .2s; }
    .qa.open .qa-chev { transform: rotate(180deg); }
    .qa-body { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
    .qa-body-inner { padding: 0 18px 18px 18px; border-top: 1px solid var(--line); margin: 0 0 0 0; }
    /* 答案：保留换行（\n→<br>），长串强制换行，杜绝错位穿模 */
    .qa-answer {
      font-size: 14.5px; color: rgba(245,244,240,.78); padding-top: 12px;
      white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
    }
    .qa-source { margin-top: 10px; font-size: 12px; color: var(--muted); word-break: break-word; overflow-wrap: anywhere; }
    .qa-score { margin-left: 8px; font-size: 11px; font-weight: 600; color: #1a1206; background: var(--warn); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }

    .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }
    .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 28px; line-height: 1.7; }
    .loading { text-align: center; color: var(--muted); padding: 22px 0; font-size: 14px; }
    .err { color: var(--err); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <span class="badge"><span class="dot"></span><span class="shiny">印章业务 · 问题解答</span></span>
      <h1>问题解答</h1>
      <p>我们实时整理归档的工作记录为常见问答，支持按主题或相近主题搜索匹配。</p>
    </div>

    <div class="backbar">
      <a class="ghost-btn" href="submit.html">
        遇到问题？去反馈
        <span class="arrow">→</span>
      </a>
    </div>

    <div class="search-card">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7" /><path d="M21 21l-4.3-4.3" />
        </svg>
        <input id="search" type="text" placeholder="搜索主题或问题描述，如：备案、调档、缴销、密码…" autocomplete="off" />
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <div class="meta" id="meta"></div>
    <div class="qa-list" id="list"></div>
    <div id="sentinel" class="loading" hidden>加载更多…</div>

    <div class="foot">
      本页面由印章业务信息管理系统提供 · 内容实时整理自归档工作记录（默认从 Gitee 拉，回退 GitHub）<br/>
      未找到答案？可点击上方「去反馈」提交您的问题。
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id)
    const listEl = $('list'), chipsEl = $('chips'), metaEl = $('meta'), searchEl = $('search'), sentinelEl = $('sentinel')

    let ITEMS = []
    let TOPICS = []
    let activeTopic = ''   // 当前选中的主题 chip（'' = 全部）
    let liveFlag = false   // 是否来自 Worker 代理（GitHub 实时数据）
    let liveSource = ''    // 实时数据来源标注
    const openSet = new Set()

    // 分批加载：每批渲染数量，触底自动加载下一批，避免一次性渲染全部卡片导致卡顿
    const BATCH = 20
    let view = []          // 当前过滤/排序后的完整列表
    let renderedCount = 0  // 已渲染到列表的条数
    let loadingBatch = false

    // —— 数据来源：Gitee contents API → GitHub contents API → 本地 ./faq.json → Worker ——
    // Gitee raw URL 公开仓也需登录态（平台限制），故走 contents API + 令牌解码 base64。
    // 令牌复用 inbox-config.js 的 GITEE_INBOX_TOKEN / INBOX_TOKEN（work-site 公开仓只读）。
    // 本地 ./faq.json 随站点公开部署，无需翻墙、不依赖被墙的 *.workers.dev。
    // 注意：进度查询页(progress-query.html)仍独立使用 FAQ_WORKER_BASE 调 /progress，此处改动不影响它。
    const FAQ_WORKER = (window.FAQ_WORKER_BASE || '').replace(/\/+$/, '')
    const GITEE_FAQ = window.GITEE_FAQ_REPO || { owner: 'aiesse', name: 'work-site', branch: 'main', file: 'faq.json' }
    const GH_FAQ = window.GH_FAQ_REPO || { owner: 'AIesse', name: 'work-site', branch: 'main', file: 'faq.json' }
    const GITEE_TOK = window.GITEE_INBOX_TOKEN || ''
    const GH_TOK = window.INBOX_TOKEN || ''
    const FAQ_PRIMARY = window.FAQ_SOURCE === 'github' ? 'github' : 'gitee'

    function b64decode(b64) { return decodeURIComponent(escape(atob((b64 || '').replace(/\s/g, '')))) }

    // 在指定源上读 faq.json（contents API），返回 { items, source }
    async function loadFromSource(source) {
      const isGitee = source === 'gitee'
      const repo = isGitee ? GITEE_FAQ : GH_FAQ
      const token = isGitee ? GITEE_TOK : GH_TOK
      const apiBase = isGitee ? 'https://gitee.com/api/v5' : 'https://api.github.com'
      let url = `${apiBase}/repos/${repo.owner}/${repo.name}/contents/${repo.file}?ref=${repo.branch}`
      const headers = { Accept: isGitee ? 'application/json' : 'application/vnd.github+json' }
      if (isGitee) {
        url += (url.includes('?') ? '&' : '?') + 'access_token=' + encodeURIComponent(token)
      } else {
        headers['Authorization'] = 'Bearer ' + token
        headers['X-GitHub-Api-Version'] = '2022-11-28'
      }
      const res = await fetch(url, { headers, cache: 'no-cache' })
      if (!res.ok) throw new Error('HTTP ' + res.status)
      const json = await res.json()
      if (!json || !json.content) throw new Error('无 content 字段')
      const data = JSON.parse(b64decode(json.content))
      const items = Array.isArray(data.items) ? data.items : []
      if (!items.length) throw new Error('空数据')
      return { items, source: isGitee ? 'Gitee' : 'GitHub' }
    }

    async function loadData() {
      // 数据来源固定为 Gitee（aiesse/work-site 的 faq.json），不再回退 GitHub contents API 与 Worker。
      // 仅当 Gitee 不可用时，回退到随站点一同部署的本地 ./faq.json（与 Gitee 同源的静态副本）。
      try {
        const r = await loadFromSource('gitee')
        liveFlag = true; liveSource = 'Gitee 实时数据'
        return r.items
      } catch (e) {
        console.warn('Gitee 拉取失败，回退本地 faq.json：', e)
      }
      // 本地 ./faq.json（与 Gitee 同源，随站点公开部署，无需翻墙、不依赖被墙的 *.workers.dev）
      try {
        const res = await fetch('./faq.json', { cache: 'no-cache' })
        if (res.ok) {
          const data = await res.json()
          const items = Array.isArray(data.items) ? data.items : []
          if (items.length) {
            liveFlag = false
            return items
          }
        }
      } catch (e) {
        console.warn('本地 faq.json 读取失败：', e)
      }
      throw new Error('Gitee 与本地 faq.json 均不可用')
    }

    // —— 文本相似度：中文按 2-gram 切分（短词退化为字符），计算 Jaccard 重叠 ——
    function grams(s) {
      s = (s || '').toLowerCase().replace(/\s+/g, '')
      if (!s) return new Set()
      if (s.length === 1) return new Set([s])
      const g = new Set()
      for (let i = 0; i < s.length - 1; i++) g.add(s.slice(i, i + 2))
      return g
    }
    function jaccard(a, b) {
      if (!a.size || !b.size) return 0
      let inter = 0
      for (const x of a) if (b.has(x)) inter++
      const union = a.size + b.size - inter
      return union ? inter / union : 0
    }

    // 计算单条记录相对于查询的匹配分（0 表示不相关）
    function scoreItem(item, q) {
      const ql = q.toLowerCase().trim()
      if (!ql) return 0
      const qg = grams(ql)
      const topic = (item.topic || '').toLowerCase()
      const kw = (item.keywords || []).map((k) => k.toLowerCase())
      const question = (item.question || '').toLowerCase()
      // 评分用的答案去掉结构性标签（处理方式：/跟踪记录：），避免「跟踪」等词因每条都含「跟踪记录：」而泛匹配全部
      const answerRaw = (item.answer || '')
      const answerClean = answerRaw.replace(/处理方式：|跟踪记录：/g, '').toLowerCase()
      const src = (item.source || '').toLowerCase()

      let score = 0
      // 1) 关键词命中（强信号）：查询包含关键词或关键词包含查询
      for (const k of kw) {
        if (!k) continue
        if (ql.includes(k) || k.includes(ql)) score += 10
      }
      // 2) 主题精确命中
      if (topic && (ql === topic || ql.includes(topic) || topic.includes(ql))) score += 8
      // 3) 主题/问题 的 bigram 相近度
      score += jaccard(qg, grams(topic + ' ' + question)) * 6
      // 4) 查询出现在问题中
      if (question.includes(ql)) score += 3
      // 5) 查询出现在答案/来源中（弱信号，用已去标签的干净答案）
      if (answerClean.includes(ql)) score += 1
      if (src.includes(ql)) score += 1
      return score
    }

    function highlight(text, q) {
      if (!q) return escapeHtml(text)
      const idx = text.toLowerCase().indexOf(q.toLowerCase())
      if (idx < 0) return escapeHtml(text)
      return escapeHtml(text.slice(0, idx)) +
        '<span class="qa-qq">' + escapeHtml(text.slice(idx, idx + q.length)) + '</span>' +
        escapeHtml(text.slice(idx + q.length))
    }
    function escapeHtml(s) {
      return (s || '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
    }
    function chevIcon() {
      return '<svg class="qa-chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>'
    }

    // 计算当前过滤 + 排序后的完整列表（不分页）
    function computeView() {
      const q = searchEl.value.trim()
      const topicOnly = activeTopic && !q
      let v = ITEMS
      if (topicOnly) {
        v = v.filter((it) => it.topic === activeTopic)
      } else if (q) {
        v = v
          .map((it) => ({ it, s: scoreItem(it, q) }))
          .filter((x) => x.s > 0)
          .sort((a, b) => b.s - a.s)
          .map((x) => x.it)
      } else {
        const order = Object.fromEntries(TOPICS.map((t, i) => [t, i]))
        v = [...v].sort((a, b) => {
          const oa = order[a.topic] ?? 99, ob = order[b.topic] ?? 99
          if (oa !== ob) return oa - ob
          return (Number(a.id) || 0) - (Number(b.id) || 0)
        })
      }
      return v
    }

    // 单条问答卡片 HTML（根据 openSet 还原展开态）
    function cardHtml(it) {
      const q = searchEl.value.trim()
      const open = openSet.has(String(it.id))
      const showScore = !!q
      const score = showScore ? scoreItem(it, q) : 0
      return (
        '<div class="qa' + (open ? ' open' : '') + '" data-id="' + escapeHtml(String(it.id)) + '">' +
          '<button class="qa-head" type="button">' +
            '<span class="qa-topic">' + escapeHtml(it.topic || '其他') + '</span>' +
            '<span class="qa-q">' + highlight(it.question, q) + (showScore ? '<span class="qa-score">相关度 ' + Math.round(score) + '</span>' : '') + '</span>' +
            chevIcon() +
          '</button>' +
          '<div class="qa-body' + (open ? ' show' : '') + '"><div class="qa-body-inner">' +
            '<div class="qa-answer">' + escapeHtml(it.answer || '').replace(/\n/g, '<br>') + '</div>' +
            (it.source ? '<div class="qa-source">来源：' + escapeHtml(it.source) + (it.status ? ' · ' + escapeHtml(it.status) : '') + '</div>' : '') +
          '</div></div>' +
        '</div>'
      )
    }

    function renderMeta() {
      const q = searchEl.value.trim()
      if (!view.length) { metaEl.innerHTML = ''; return }
      if (q) {
        metaEl.innerHTML = '匹配到 <span class="result-tag">' + view.length + '</span> 条与「' + escapeHtml(q) + '」相关的解答' +
          (view.length ? '（含主题精确匹配与相近主题模糊匹配，已按相关度排序）' : '')
      } else if (activeTopic) {
        metaEl.innerHTML = '主题：<span class="result-tag">' + escapeHtml(activeTopic) + '</span> · 共 ' + view.length + ' 条'
      } else {
        let s = '共 ' + view.length + ' 条解答 · 覆盖 ' + TOPICS.length + ' 个主题'
        if (liveFlag) s += ' · <span class="src-tag">' + escapeHtml(liveSource) + '</span>'
        metaEl.innerHTML = s
      }
    }

    function updateSentinel() {
      sentinelEl.hidden = renderedCount >= view.length
    }

    // 追加下一批卡片（增量，不重建已渲染内容，避免卡顿）
    function loadMore() {
      if (renderedCount >= view.length) { updateSentinel(); return }
      const slice = view.slice(renderedCount, renderedCount + BATCH)
      const html = slice.map((it) => cardHtml(it)).join('')
      listEl.insertAdjacentHTML('beforeend', html)
      renderedCount += slice.length
      // 还原已展开卡片的高度（scrollHeight 需 DOM 就绪后读取）
      listEl.querySelectorAll('.qa.open .qa-body').forEach((b) => { b.style.maxHeight = b.scrollHeight + 'px' })
      updateSentinel()
    }

    // 重置列表（搜索/主题切换时调用）：清空后首屏渲染一批，剩余由 sentinel 滚动加载
    function renderReset() {
      view = computeView()
      renderMeta()
      if (!view.length) {
        listEl.innerHTML = '<div class="empty">没有找到相关解答，换个关键词试试，或点击上方「去反馈」提交问题。</div>'
        sentinelEl.hidden = true
        return
      }
      listEl.innerHTML = ''
      renderedCount = 0
      loadMore()
    }

    function renderChips() {
      const all = ['全部', ...TOPICS]
      chipsEl.innerHTML = all.map((t) => {
        const active = (t === '全部' && !activeTopic) || t === activeTopic
        return '<span class="chip' + (active ? ' active' : '') + '" data-topic="' + escapeHtml(t === '全部' ? '' : t) + '">' + escapeHtml(t) + '</span>'
      }).join('')
      chipsEl.querySelectorAll('.chip').forEach((c) => {
        c.addEventListener('click', () => {
          const t = c.getAttribute('data-topic')
          activeTopic = (t === activeTopic) ? '' : t
          if (activeTopic) searchEl.value = ''
          renderChips()
          renderReset()
        })
      })
    }

    // 事件委托：展开/收起（绑定在固定父节点 listEl 上，innerHTML 替换不影响）
    listEl.addEventListener('click', (e) => {
      const head = e.target.closest('.qa-head')
      if (!head) return
      const qa = head.closest('.qa')
      const id = qa.getAttribute('data-id')
      if (openSet.has(id)) openSet.delete(id); else openSet.add(id)
      qa.classList.toggle('open')
      const body = qa.querySelector('.qa-body')
      if (qa.classList.contains('open')) body.style.maxHeight = body.scrollHeight + 'px'
      else body.style.maxHeight = '0px'
    })

    // 触底自动加载更多（sentinel 进入视口附近即触发）
    const io = new IntersectionObserver((entries) => {
      if (entries[0].isIntersecting && !loadingBatch && renderedCount < view.length) {
        loadingBatch = true
        loadMore()
        loadingBatch = false
      }
    }, { root: null, rootMargin: '300px' })
    io.observe(sentinelEl)

    searchEl.addEventListener('input', () => {
      activeTopic = ''
      renderChips()
      renderReset()
    })

    ;(async () => {
      try {
        const raw = await loadData()
        // 仅展示「已归档」状态的数据（数据源理论上已仅含已归档，此处为防御性兜底过滤）
        ITEMS = raw.filter((i) => (i.status || '').trim() === '已归档')
        TOPICS = [...new Set(ITEMS.map((i) => i.topic).filter(Boolean))]
        renderChips()
        renderReset()
      } catch (err) {
        listEl.innerHTML = '<div class="empty err">加载问答数据失败：' + escapeHtml(err.message || err) + '<br/>请确认 faq.json 与本页面同目录，或在 faq-config.js 中配置 FAQ_WORKER_BASE。</div>'
        sentinelEl.hidden = true
      }
    })()
  </script>
</body>
</html>
